[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "paris"
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]
fs_permissions = []

[profile.default.fuzz]
runs = 512
seed = "0x7ea5c0de"

[profile.default.invariant]
runs = 256
depth = 48
fail_on_revert = false
call_override = false

[profile.ci.fuzz]
runs = 2048

[profile.ci.invariant]
runs = 1024
depth = 64

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
